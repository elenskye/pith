<script>
// 明暗：Vermilion 的 tokens 按 data-theme 切。跟系统走；地址带 ?theme=dark / light 时照它。
(() => {
  const q = new URLSearchParams(location.search).get('theme');
  const m = window.matchMedia('(prefers-color-scheme: dark)');
  const set = () => { document.documentElement.dataset.theme = q === 'dark' || q === 'light' ? q : m.matches ? 'dark' : 'light'; };
  set();
  if (m.addEventListener) m.addEventListener('change', set);
})();
</script>

<style>
/* visual-atelier 通用问卷模板（skills/questionnaire/template/survey.html），用 Design System「Vermilion 朱红」做的（站主 2026-11-13）。
   版面：单栏，一次一页。暖纸的底；页码是一条漫游路径（点线连着时间线的空心圆，到了的那页圆心变朱红）；每道题一张卡，
   说明是一张纸片。青绿管结构和建议，朱红只在悬停、选中、焦点和「没答」时出现。
   下面 vermilion:tokens 那一段是 Vermilion 的 tokens，由 node skills/questionnaire/template/vermilion.mjs 从构建好的
   Design System 写进来，别手改；别的样式不用改，要改的只有 <script> 开头「改这里」那一段。 */
/* vermilion:tokens */
/* Vermilion 朱红 — generated from tokens.json */
:root, [data-theme="light"] {
  --color-page: #f6efe2;
  --color-surface: #fdf9f0;
  --color-surface-cool: #ece0cb;
  --color-text: #1b1d1c;
  --color-muted: #686359;
  --color-line: #ddd2bf;
  --color-soft-line: #e6dfd3;
  --color-accent: #2d6f6a;
  --color-accent-strong: #28625d;
  --color-accent-soft: #daddd1;
  --color-ember: #bf2929;
  --color-focus: var(--color-ember);
  --shadow-soft: 0 18px 42px rgba(27, 29, 28, 0.08);
}
[data-theme="dark"] {
  --color-page: #14201f;
  --color-surface: #233230;
  --color-surface-cool: #1d2b29;
  --color-text: #f2ece0;
  --color-muted: #c1b9ac;
  --color-line: #384340;
  --color-soft-line: #343e3b;
  --color-accent: #77c8c2;
  --color-accent-strong: #87cfc9;
  --color-accent-soft: #263e3c;
  --color-ember: #ffa196;
  --color-focus: var(--color-ember);
  --shadow-soft: 0 18px 42px rgba(0, 0, 0, 0.4);
}
:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 72px;
  --space-9: 96px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --width-chrome: 1320px;
  --width-wide: 1240px;
  --text-xs: 0.82rem;
  --text-sm: 0.94rem;
  --text-md: 1rem;
  --text-lg: 1.18rem;
  --text-xl: 1.5rem;
  --text-display: 4.2rem;
  --text-display-mobile: 2.9rem;
  --font-sans: "Work Sans", "Noto Sans SC", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-serif: "Source Serif 4", "Noto Serif SC", ui-serif, "Iowan Old Style", Georgia, "Times New Roman", "Songti SC", "Noto Serif CJK SC", serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
/* /vermilion:tokens */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; background: var(--color-page); color: var(--color-text); font: var(--text-md)/1.7 var(--font-sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--color-accent-soft); color: var(--color-text); }
b, strong { font-weight: 500; }
code { font: 0.9em var(--font-mono); background: var(--color-surface-cool); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 820px; margin: 0 auto; padding-inline: var(--space-5); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

/* 页头：横线只在页头底部 */
.bar { position: sticky; top: 0; z-index: 5; background: var(--color-page); border-bottom: 1px solid var(--color-line); }
.bar .wrap { display: flex; align-items: center; gap: var(--space-2) var(--space-5); padding-block: var(--space-3); flex-wrap: wrap; }
.bar h1 { margin: 0; font: 400 var(--text-lg)/1.3 var(--font-serif); white-space: nowrap; }
.save { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }
.save.warn { color: var(--color-ember); }

/* 页码：一条漫游路径，空心圆是时间线的节点 */
.steps { position: relative; display: flex; flex: 1 1 auto; flex-wrap: wrap; align-items: center; gap: 2px var(--space-2); min-width: 0; }
.step {
  position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 var(--space-1);
  border: 0; background: none; color: var(--color-muted); font: var(--text-xs)/1 var(--font-sans); cursor: pointer;
}
.step + .step::before { content: ""; width: 18px; border-top: 2px dotted var(--color-line); margin-right: 3px; }
.node { width: 13px; height: 13px; flex: none; border: 2px solid var(--color-accent); border-radius: 50%; background: var(--color-page); display: grid; place-items: center; }
.node::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--color-ember); transform: scale(0); transition: transform 180ms ease; }
.step.done .node { background: var(--color-accent); }
.step[aria-current="step"] { color: var(--color-text); }
.step[aria-current="step"] .node { border-color: var(--color-ember); background: var(--color-page); }
.step[aria-current="step"] .node::after { transform: scale(1); }
.step:hover { color: var(--color-text); }
.step:hover .node { border-color: var(--color-ember); }
.step .name { display: none; }
.step[aria-current="step"] .name { display: inline; }

/* 页的开头 */
main { padding-block: var(--space-7) var(--space-9); }
.page-head { display: grid; gap: var(--space-2); margin-bottom: var(--space-5); }
.eyebrow { margin: 0; font-size: var(--text-xs); color: var(--color-muted); }
h2 { margin: 0; display: flex; align-items: flex-start; gap: var(--space-2); font: 400 clamp(1.55rem, 1.3rem + 1.1vw, 2rem)/1.3 var(--font-serif); text-wrap: balance; }
h2 .glyph { width: 0.9em; height: 0.9em; margin-top: 0.22em; flex: none; color: var(--color-accent); }
.lead { margin: 0; color: var(--color-muted); max-width: 62ch; }
.fill-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); margin-bottom: var(--space-6); }
.fill-info { font-size: var(--text-sm); color: var(--color-muted); }

/* 纸片：给站主的背景 */
.note { background: var(--color-surface-cool); color: var(--color-text); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-6); border-radius: var(--radius-md); }
.note-t { margin: 0 0 var(--space-1); font: 400 var(--text-lg)/1.4 var(--font-serif); }
.note ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: var(--text-sm); }
.note code { background: var(--color-surface); }

/* 一道题一张卡 */
.frame { margin: 0 0 var(--space-6); min-width: 0; }
.strip { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin: 0 0 6px 2px; font-size: var(--text-xs); line-height: 1.4; color: var(--color-muted); }
.strip b { color: var(--color-accent-strong); font-weight: 500; letter-spacing: 0.04em; }
.board { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-md); padding: var(--space-5); }
.q-title { margin: 0; font: 400 var(--text-lg)/1.5 var(--font-serif); }
.hint { margin: 4px 0 0; color: var(--color-muted); font-size: var(--text-sm); }
.hint-list { padding-left: 1.1em; display: grid; gap: 4px; margin-top: var(--space-2); }

/* 选项：悬停、选中是朱红的细边和圆点 */
.opts { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
.opts.cards { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.opt {
  position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px var(--space-3); align-items: start;
  min-height: 44px; padding: var(--space-3) var(--space-4); border: 1px solid var(--color-line); border-radius: var(--radius-sm);
  background: var(--color-surface); cursor: pointer; transition: border-color 180ms ease, box-shadow 180ms ease;
}
.opt:hover { border-color: var(--color-ember); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.mark { width: 16px; height: 16px; margin-top: 5px; border: 1.5px solid var(--color-muted); border-radius: 50%; display: grid; place-items: center; }
.multi .mark { border-radius: 4px; }
.mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--color-ember); transform: scale(0); transition: transform 180ms ease; }
.multi .mark::after { border-radius: 2px; }
.opt:has(input:checked) { border-color: var(--color-ember); box-shadow: 0 0 0 1px var(--color-ember); }
.opt:has(input:checked) .mark { border-color: var(--color-ember); }
.opt:has(input:checked) .mark::after { transform: scale(1); }
.opt:has(input:focus-visible) { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.opt-t { display: flex; flex-wrap: wrap; align-items: center; gap: 2px var(--space-2); }
.opt-t b { font-weight: 500; }
.opt-d { grid-column: 2; color: var(--color-muted); font-size: var(--text-sm); }
.opt-fig { grid-column: 1 / -1; margin-bottom: var(--space-2); min-width: 0; }
.opt-fig img, .opt-fig svg { display: block; max-width: 100%; height: auto; border-radius: var(--radius-sm); }
.tag { font-size: 0.75rem; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--color-accent); color: var(--color-accent-strong); white-space: nowrap; }

/* 矩阵：每行选一个 */
.rows { display: grid; }
.rowq { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-5); align-items: center; padding: var(--space-3) 0; border-top: 1px solid var(--color-soft-line); }
.rowq:first-child { border-top: 0; padding-top: 0; }
.rowq:last-child { padding-bottom: 0; }
.rowq-no { font-size: var(--text-xs); color: var(--color-accent-strong); margin-right: 6px; letter-spacing: 0.04em; }
.rowq-t b { font-weight: 500; }
.why { display: block; color: var(--color-muted); font-size: var(--text-sm); margin-top: 2px; }
.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--color-line); border-radius: var(--radius-sm); overflow: hidden; }
.seg label { position: relative; cursor: pointer; }
.seg label + label { border-left: 1px solid var(--color-line); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span.lb { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 5px var(--space-3); font-size: var(--text-sm); color: var(--color-muted); white-space: nowrap; transition: color 180ms ease, background 180ms ease; }
.seg .rec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); flex: none; }
.seg label:hover span.lb { color: var(--color-text); box-shadow: inset 0 -2px 0 var(--color-ember); }
.seg input:checked + span.lb { background: var(--color-accent-soft); color: var(--color-text); font-weight: 500; box-shadow: inset 0 -2px 0 var(--color-ember); }
.seg input:focus-visible + span.lb { outline: 2px solid var(--color-focus); outline-offset: -2px; }
.legend { margin: 0 0 var(--space-3); font-size: var(--text-xs); color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
.legend .rec-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); display: inline-block; }

textarea {
  display: block; width: 100%; min-height: 80px; margin-top: var(--space-3); padding: 10px 12px; resize: vertical;
  border: 1px solid var(--color-line); border-radius: var(--radius-sm); background: var(--color-page); color: var(--color-text); font: inherit;
}
textarea:hover { border-color: var(--color-accent); }
.board > textarea:first-child { margin-top: 0; }

/* 按钮：Design System 的 ButtonLink（青绿描边，悬停铺一层浅青）；往下走的那个实心 */
.btn {
  display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 var(--space-4);
  border: 1px solid var(--color-accent); border-radius: var(--radius-sm); background: transparent; color: var(--color-accent-strong);
  font: 500 var(--text-sm) var(--font-sans); cursor: pointer; transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
}
.btn:hover { border-color: var(--color-accent-strong); background: var(--color-accent-soft); color: var(--color-text); }
.btn.primary { background: var(--color-accent-strong); border-color: var(--color-accent-strong); color: var(--color-page); }
.btn.primary:hover { background: var(--color-accent-soft); color: var(--color-text); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-2); }
.pager-info { font-size: var(--text-xs); color: var(--color-muted); }

/* 核对与提交 */
.review summary { cursor: pointer; font: 400 var(--text-lg) var(--font-serif); }
.review h3 { display: flex; align-items: baseline; gap: var(--space-2); margin: var(--space-5) 0 var(--space-1); font-size: var(--text-sm); font-weight: 500; }
.review dl { margin: 0; display: grid; gap: var(--space-2); }
.review dt { font-size: var(--text-xs); color: var(--color-muted); }
.review dd { margin: 0; font-size: var(--text-sm); white-space: pre-wrap; overflow-wrap: anywhere; }
.review dd.empty { color: var(--color-ember); }
.review .go { min-height: 0; padding: 0; border: 0; background: none; color: var(--color-accent-strong); font: inherit; font-size: var(--text-xs); cursor: pointer; text-decoration: underline; text-underline-offset: 0.22em; }
.review .go:hover { color: var(--color-ember); }
.done-box { background: var(--color-surface-cool); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); }
.done-box p { margin: 0; }
.copy-row { margin-top: var(--space-4); display: grid; gap: 6px; }
.copy-row .hint { margin: 0; }

@media (max-width: 640px) {
  .rowq { grid-template-columns: minmax(0, 1fr); }
  .seg { display: grid; }
  .wrap { padding-inline: var(--space-4); }
  .board { padding: var(--space-4); }
  .note { padding: var(--space-3) var(--space-4); }
  .bar h1 { white-space: normal; }
  .step + .step::before { width: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 第五轮问卷的图样：只用 Vermilion 的颜色变量；画风样例（A3、A4）的颜色写在图里。 */
.fig { display: block; width: 100%; height: auto; background: var(--color-surface-cool); border-radius: var(--radius-sm); }
.fig.wide { max-width: 540px; margin-top: var(--space-4); }
.opts.cards { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.opts.cards .opt { align-content: start; }
.opts.cards:has(> .opt:nth-child(3):last-child) { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.fig text { font: 500 11px var(--font-sans); fill: var(--color-text); }
.fig text.big { font-size: 13px; }
.fig text.mu { fill: var(--color-muted); }
.fig .s { fill: none; stroke: var(--color-text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fig .sa { stroke: var(--color-accent); }
.fig .se { stroke: var(--color-ember); }
.fig .sm { stroke: var(--color-muted); }
.fig .thin { stroke-width: 1.3; }
.fig .w3 { stroke-width: 3.2; }
.fig .dash { stroke-dasharray: 3 5; }
.fig .ft { fill: var(--color-text); }
.fig .fa { fill: var(--color-accent); }
.fig .fe { fill: var(--color-ember); }
.fig .fm { fill: var(--color-muted); }
.fig .fp { fill: var(--color-page); }
.fig .fs { fill: var(--color-surface); }
.fig .fc { fill: var(--color-accent-soft); }
.fig .ot { stroke: var(--color-text); stroke-width: 1.6; stroke-linejoin: round; }
.fig .om { stroke: var(--color-muted); stroke-width: 1.3; stroke-linejoin: round; }
.fig .oa { stroke: var(--color-accent); stroke-width: 2; stroke-linejoin: round; }
.fig .oe { stroke: var(--color-ember); stroke-width: 2; stroke-linejoin: round; }
.fig .cut { filter: drop-shadow(0 1.5px 1px rgba(0, 0, 0, 0.28)); }
</style>
</head>

<!-- 漫游路径：Vermilion 的 marks/route-glyph.svg，放在每页大标题前 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="route-glyph" viewBox="0 0 32 32"><path d="M5 27c7-2 4-8 9-11s10-2 10-8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" stroke-dasharray="0.5 4.4"/><circle cx="24.5" cy="6" r="3.2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/></symbol></svg>

<script>
// ==================== 改这里 ====================
// Pith 第五轮问卷（v0.5 WonderLab，重出）。题型的写法见 visual-atelier 的 skills/questionnaire/template/survey.html。
const SURVEY = {
  title: 'Pith v0.5 问卷',
  key: 'pith-round5-wonderlab',
};

// ---------- 图样：每个选项上面的示意图，只表示意思 ----------
const svg = (b, w = 240, h = 136) => `<svg class="fig" viewBox="0 0 ${w} ${h}" aria-hidden="true">${b}</svg>`;
const fillOf = (c) => (c[0] === '#' ? `fill="${c}"` : `class="${c}"`);
const man = (x, y, c = 'ft', k = 1) => `<g transform="translate(${x} ${y}) scale(${k})"><circle cy="-19" r="5.5" class="${c}"/><path d="M-8 0v-5a8 8 0 0 1 16 0v5z" class="${c}"/></g>`;
const pins = (x, y, n, gap = 6) => Array.from({ length: n }, (_, i) => `<path d="M${x + i * gap} ${y}v-10" class="s sa"/><circle cx="${x + i * gap}" cy="${y - 11}" r="1.8" class="fa"/>`).join('');
const bench = (x, y, w = 28) => `<path d="M${x} ${y}h${w}M${x + 4} ${y}v10M${x + w - 4} ${y}v10" class="s"/>`;
const chip = (x, y, w, t, c = 'fs') => `<rect x="${x}" y="${y}" width="${w}" height="20" rx="10" class="${c}"/><text x="${x + w / 2}" y="${y + 14}" text-anchor="middle">${t}</text>`;
const box = (x, y, s, h, top = 'fs', l = 'fc', r = 'fa') => `<path d="M${x} ${y}l${s} ${s / 2}l${-s} ${s / 2}l${-s} ${-s / 2}z" ${fillOf(top)}/><path d="M${x - s} ${y + s / 2}l${s} ${s / 2}v${h}l${-s} ${-s / 2}z" ${fillOf(l)}/><path d="M${x + s} ${y + s / 2}l${-s} ${s / 2}v${h}l${s} ${-s / 2}z" ${fillOf(r)}/>`;
const star = (x, y, r, c) => `<polygon class="${c}" points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5; const q = i % 2 ? r * 0.45 : r; return (x + q * Math.cos(a)).toFixed(1) + ',' + (y + q * Math.sin(a)).toFixed(1); }).join(' ')}"/>`;
const arrow = (x1, y1, x2, y2, c = 's sm') => { const a = Math.atan2(y2 - y1, x2 - x1); const p = (t) => `${(x2 - 6 * Math.cos(a + t)).toFixed(1)} ${(y2 - 6 * Math.sin(a + t)).toFixed(1)}`; return `<path d="M${x1} ${y1}L${x2} ${y2}M${p(0.55)}L${x2} ${y2}L${p(-0.55)}" class="${c}"/>`; };

// ---------- 状态 ----------
const DOC = 'survey/answers';
let state = { answers: {}, page: 0, submitted: false, submittedAt: null, updatedAt: null };
try { const s = JSON.parse(localStorage.getItem(SURVEY.key) || 'null'); if (s && s.answers) state = Object.assign(state, s); } catch (e) {}
if (!(state.page >= 0 && state.page < PAGES.length)) state.page = 0;
let db = null; let dbState = 'pending';
const saveEl = document.getElementById('save');
const main = document.getElementById('main');
const stepsEl = document.getElementById('steps');
document.title = SURVEY.title;
document.getElementById('title').textContent = SURVEY.title;
function setSave(text, warn) { saveEl.textContent = text; saveEl.classList.toggle('warn', !!warn); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function plain(s) { return String(s).replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'); }
function groupsOf(q) { return q.groups || [{ label: q.title || '', sub: q.hint, rows: q.rows || [] }]; }

// 所有要答的项：选择题、文字题，矩阵摊成一行一项
function itemsOf(pi) {
  const out = [];
  PAGES[pi].items.forEach((q) => {
    if (q.type === 'rows') groupsOf(q).forEach((g) => g.rows.forEach((r) => out.push({ id: r.id, label: plain(r.t), scale: q.scale, rec: r.rec })));
    else out.push({ id: q.id, label: plain(q.title), q, rec: q.rec });
  });
  return out;
}
function allItems() { return PAGES.flatMap((_, i) => itemsOf(i).map((it) => Object.assign({ page: i }, it))); }
function answered(it) { const v = state.answers[it.id]; return !(v == null || v === '' || (Array.isArray(v) && !v.length)); }
function required(it) { return !(it.q && it.q.type === 'text'); }
function answerText(it) {
  if (!answered(it)) return '';
  const v = state.answers[it.id];
  if (it.scale) return (it.scale.find((s) => s.v === v) || {}).t || v;
  if (it.q.type === 'text') return v;
  const pick = (x) => { const o = it.q.options.find((o) => o.v === x); return o ? plain(o.t) : x; };
  return Array.isArray(v) ? v.map(pick).join('；') : pick(v);
}
function left(pi) { return itemsOf(pi).filter((it) => required(it) && !answered(it)).length; }
function summary() {
  const s = {};
  allItems().forEach((it) => { s[it.id + ' ' + it.label] = answerText(it) || '（未答）'; });
  PAGES.forEach((p, i) => { const n = state.answers['note' + (i + 1)]; if (n) s['第 ' + (i + 1) + ' 页补充'] = n; });
  return s;
}
function summaryText() { return SURVEY.title + '\n' + Object.entries(summary()).map(([k, v]) => k + '：' + v).join('\n'); }

// ---------- 保存 ----------
let saveTimer = null; let writing = false; let dirty = false;
function persist(immediate) {
  state.updatedAt = new Date().toISOString();
  saveLocal();
  renderSteps();
  clearTimeout(saveTimer);
  if (!db) { if (dbState === 'none') setSave('答案只存在这台设备上'); return; }
  setSave('保存中…');
  saveTimer = setTimeout(writeDb, immediate ? 0 : 500);
}
function saveLocal() { try { localStorage.setItem(SURVEY.key, JSON.stringify(state)); } catch (e) {} }
async function writeDb(retry) {
  if (writing) { dirty = true; return; }
  writing = true;
  const body = { answers: state.answers, summary: summary(), submitted: state.submitted, submittedAt: state.submittedAt, updatedAt: state.updatedAt };
  try {
    await db.doc(DOC).set(body);
    setSave('已保存 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    if (e && e.code === 'unavailable' && !retry) { writing = false; setTimeout(() => writeDb(true), 800 + Math.random() * 800); return; }
    setSave('保存失败，答案暂存在这台设备上', true);
  }
  writing = false;
  if (dirty) { dirty = false; writeDb(); }
}

// ---------- 渲染 ----------
function strip(no, kind) { return `<p class="strip"><b>${no}</b><span>${kind}</span></p>`; }
function kindOf(q) {
  if (q.type === 'multi') return q.max ? `可多选，最多 ${q.max} 个` : '可多选';
  if (q.type === 'text') return '可不填';
  if (q.type === 'rows') return '每行选一个';
  return '单选';
}
function optHtml(q, o) {
  const type = q.type === 'multi' ? 'checkbox' : 'radio';
  const isRec = Array.isArray(q.rec) ? q.rec.includes(o.v) : q.rec === o.v;
  return `<label class="opt">${o.fig ? `<span class="opt-fig">${o.fig}</span>` : ''}
    <input type="${type}" name="${q.id}" value="${o.v}" id="${q.id}-${o.v}"><span class="mark" aria-hidden="true"></span>
    <span class="opt-t"><b>${o.t}</b>${isRec ? '<span class="tag">建议</span>' : ''}</span>
    ${o.d ? `<span class="opt-d">${o.d}</span>` : ''}</label>`;
}
function rowsHtml(q) {
  const hasRec = groupsOf(q).some((g) => g.rows.some((r) => r.rec));
  return groupsOf(q).map((g, gi) => `<section class="frame" aria-label="${esc(plain(g.label || q.id))}">
    <p class="strip"><b>${g.label || q.id.toUpperCase()}</b><span>${g.sub ? g.sub + ' · ' : ''}${kindOf(q)}</span></p>
    <div class="board">${hasRec && gi === 0 ? '<p class="legend"><i class="rec-dot" aria-hidden="true"></i>带圆点的是建议</p>' : ''}<div class="rows">${g.rows.map((r) => `<div class="rowq" role="radiogroup" aria-labelledby="${r.id}-t">
      <div class="rowq-t" id="${r.id}-t"><span class="rowq-no">${r.id}</span>${r.t}${r.why ? `<span class="why">${r.why}</span>` : ''}</div>
      <div class="seg">${q.scale.map((s) => `<label><input type="radio" name="${r.id}" value="${s.v}" id="${r.id}-${s.v}"><span class="lb">${r.rec === s.v ? '<i class="rec-dot" aria-hidden="true"></i>' : ''}${s.t}${r.rec === s.v ? '<span class="sr">（建议）</span>' : ''}</span></label>`).join('')}</div>
    </div>`).join('')}</div></div></section>`).join('');
}
function qHtml(q) {
  if (q.type === 'rows') return rowsHtml(q);
  const no = q.id.toUpperCase();
  const head = `<p class="q-title" id="${q.id}-t">${q.title}</p>${q.hint ? `<p class="hint">${q.hint}</p>` : ''}`;
  if (q.type === 'text') {
    return `<section class="frame">${strip(no, kindOf(q))}<div class="board">${head}
      ${q.list ? `<ul class="hint hint-list">${q.list.map((x) => `<li>${x}</li>`).join('')}</ul>` : ''}
      <textarea id="${q.id}" name="${q.id}" aria-labelledby="${q.id}-t"></textarea></div></section>`;
  }
  const multi = q.type === 'multi';
  return `<section class="frame ${multi ? 'multi' : ''}" role="${multi ? 'group' : 'radiogroup'}" aria-labelledby="${q.id}-t">${strip(no, kindOf(q))}
    <div class="board">${head}<div class="opts ${q.layout === 'cards' ? 'cards' : ''}">${q.options.map((o) => optHtml(q, o)).join('')}</div></div></section>`;
}
function renderSteps() {
  stepsEl.innerHTML = PAGES.map((p, i) => {
    const done = p.review ? state.submitted : left(i) === 0;
    return `<button type="button" class="step ${done ? 'done' : ''}" data-page="${i}" ${i === state.page ? 'aria-current="step"' : ''} aria-label="第 ${i + 1} 页：${p.name}${done ? '，已完成' : ''}"><span class="node" aria-hidden="true"></span>${i + 1}<span class="name">${p.name}</span></button>`;
  }).join('');
}
function missingAll() { return allItems().filter((it) => required(it) && !answered(it)).length; }
function recLeft(all) { return (all ? allItems() : itemsOf(state.page)).filter((it) => it.rec && !answered(it)).length; }
function fillInfo(pi) {
  if (PAGES[pi].review) { const n = missingAll(); return n ? `全卷还差 ${n} 项` : '全卷都选完了'; }
  const n = left(pi); return n ? `这一页还差 ${n} 项` : '这一页选完了';
}
function reviewHtml() {
  const missing = missingAll();
  const body = PAGES.map((p, pi) => {
    if (p.review) return '';
    const items = itemsOf(pi); const note = state.answers['note' + (pi + 1)];
    if (!items.length && !note) return '';
    return `<h3>第 ${pi + 1} 页 · ${esc(p.name)}<button type="button" class="go" data-page="${pi}">去改</button></h3><dl>${items.map((it) => `<div><dt>${esc(it.id.toUpperCase())} ${esc(it.label)}</dt><dd class="${answered(it) || !required(it) ? '' : 'empty'}">${answered(it) ? esc(answerText(it)) : (required(it) ? '未答' : '没填')}</dd></div>`).join('')}${note ? `<div><dt>这一页想补充的</dt><dd>${esc(note)}</dd></div>` : ''}</dl>`;
  }).join('');
  return `<details class="review" open><summary>全部答案${missing ? `（还有 ${missing} 项没选）` : '（都选完了）'}</summary>${body}</details>`;
}
function doneHtml() {
  if (!state.submitted) return '';
  const when = state.submittedAt ? new Date(state.submittedAt).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  return `<div class="done-box"><p>已提交（${when}）。回到对话告诉 Agent「问卷填好了」。${db ? '之后改答案会自动更新。' : '这个页面连不上存储，请点下面的「复制答案」，贴回对话。'}</p></div>`;
}
function submitBoard() {
  return `<section class="frame">${strip('提交', '')}<div class="board" id="review-board">${doneHtml()}${reviewHtml()}
    <div class="copy-row"><p class="hint">${db ? '答案自动存进了页面存储，Agent 能直接读。' : '连不上存储时，复制答案贴回对话。'}</p>
    <div><button type="button" class="btn" id="copy">复制答案</button></div><textarea id="copy-text" readonly aria-label="答案文本"></textarea></div></div></section>`;
}
function render() {
  const p = PAGES[state.page]; const pi = state.page; const last = pi === PAGES.length - 1;
  main.innerHTML = `<section aria-labelledby="ph">
    <div class="page-head"><p class="eyebrow">第 ${pi + 1} 页，共 ${PAGES.length} 页</p><h2 id="ph"><svg class="glyph" aria-hidden="true"><use href="#route-glyph"></use></svg><span>${p.title}</span></h2>${p.lead ? `<p class="lead">${p.lead}</p>` : ''}</div>
    ${p.note ? `<aside class="note"><p class="note-t">${p.note.t}</p><ul>${p.note.items.map((x) => `<li>${x}</li>`).join('')}</ul></aside>` : ''}
    ${(p.review ? recLeft(true) : itemsOf(pi).some((it) => it.rec)) ? `<div class="fill-row"><button type="button" class="btn" id="fill">${p.review ? '全卷没选的都按建议填' : '没选的都按建议填'}</button><span class="fill-info" id="fill-info" role="status">${fillInfo(pi)}</span></div>` : `<div class="fill-row"><span class="fill-info" id="fill-info" role="status">${fillInfo(pi)}</span></div>`}
    ${p.items.map(qHtml).join('')}
    ${p.review ? submitBoard() : `<section class="frame">${strip('这一页想补充的', '可不填')}<div class="board"><textarea id="note${pi + 1}" name="note${pi + 1}" aria-label="这一页想补充的"></textarea></div></section>`}
    <div class="pager">
      ${pi > 0 ? '<button type="button" class="btn" id="prev">上一页</button>' : '<span></span>'}
      <span class="pager-info">${pi + 1} / ${PAGES.length}</span>
      ${last ? `<button type="button" class="btn primary" id="submit">${state.submitted ? '更新提交' : '提交问卷'}</button>` : '<button type="button" class="btn primary" id="next">下一页</button>'}
    </div></section>`;
  main.querySelectorAll('input').forEach((inp) => {
    const v = state.answers[inp.name];
    inp.checked = Array.isArray(v) ? v.includes(inp.value) : v === inp.value;
  });
  main.querySelectorAll('textarea[name]').forEach((t) => { t.value = state.answers[t.name] || ''; });
  const ct = document.getElementById('copy-text');
  if (ct) ct.value = summaryText();
  renderSteps();
}
function afterChange() {
  const info = document.getElementById('fill-info'); if (info) info.textContent = fillInfo(state.page);
}
function go(i) { state.page = Math.max(0, Math.min(PAGES.length - 1, i)); saveLocal(); render(); window.scrollTo(0, 0); }
function fillRec() {
  const all = !!PAGES[state.page].review;
  let n = 0;
  (all ? allItems() : itemsOf(state.page)).forEach((it) => {
    if (it.rec && !answered(it)) { state.answers[it.id] = Array.isArray(it.rec) ? it.rec.slice() : it.rec; n += 1; }
  });
  const y = window.scrollY;
  persist(); render(); window.scrollTo(0, y);
  const info = document.getElementById('fill-info');
  if (info) info.textContent = (n ? `按建议填了 ${n} 项，随时能改。` : '没有可以按建议填的了。') + fillInfo(state.page);
}

main.addEventListener('change', (e) => {
  const t = e.target; if (!t.name || t.tagName !== 'INPUT') return;
  if (t.type === 'checkbox') {
    const q = PAGES.flatMap((p) => p.items).find((x) => x.id === t.name);
    let arr = Array.isArray(state.answers[t.name]) ? state.answers[t.name].slice() : [];
    if (t.checked) {
      if (q && q.max && arr.length >= q.max) {
        t.checked = false;
        const info = document.getElementById('fill-info');
        if (info) info.textContent = `${t.name.toUpperCase()} 最多选 ${q.max} 个，先取消一个。`;
        return;
      }
      arr.push(t.value);
    } else arr = arr.filter((x) => x !== t.value);
    state.answers[t.name] = arr;
  } else state.answers[t.name] = t.value;
  persist(); afterChange();
});
main.addEventListener('input', (e) => {
  if (e.target.tagName === 'TEXTAREA' && e.target.name) { state.answers[e.target.name] = e.target.value; persist(); afterChange(); }
});
main.addEventListener('click', async (e) => {
  const id = e.target.id;
  if (id === 'next') go(state.page + 1);
  if (id === 'prev') go(state.page - 1);
  if (id === 'fill') fillRec();
  if (e.target.classList.contains('go')) go(Number(e.target.dataset.page));
  if (id === 'submit') {
    state.submitted = true; state.submittedAt = new Date().toISOString();
    persist(true); render();
    const rb = document.getElementById('review-board'); if (rb) rb.scrollIntoView({ block: 'start' });
  }
  if (id === 'copy') {
    const ta = document.getElementById('copy-text');
    try { await navigator.clipboard.writeText(ta.value); e.target.textContent = '已复制'; }
    catch (err) { ta.focus(); ta.select(); e.target.textContent = '请按 ⌘C 复制已选中的文字'; }
  }
});
stepsEl.addEventListener('click', (e) => { const b = e.target.closest('.step'); if (b) go(Number(b.dataset.page)); });

render();

// ---------- 连接存储 ----------
// 云端的运行时比页面脚本晚一点才把 window.claude 放上来：每 100ms 看一次，等满 10 秒还没有才算没有存储。
async function connectDb() {
  for (let i = 0; i < 100; i += 1) {
    // 照字面写 window.claude.use(：本地 dw serve 看到这几个字才注入本地版存储
    if (window.claude && typeof window.claude.use === 'function') { try { return await window.claude.use('db'); } catch (e) { return null; } }
    await new Promise((r) => setTimeout(r, 100));
  }
  return null;
}
(async () => {
  db = await connectDb();
  if (!db) { dbState = 'none'; setSave('答案只存在这台设备上'); render(); return; }
  dbState = 'ok';
  try {
    const snap = await db.doc(DOC).get();
    if (snap.exists) {
      const d = snap.data();
      if (!state.updatedAt || (d.updatedAt && d.updatedAt > state.updatedAt)) {
        state.answers = JSON.parse(JSON.stringify(d.answers || {}));
        state.submitted = !!d.submitted; state.submittedAt = d.submittedAt || null; state.updatedAt = d.updatedAt || null;
        saveLocal();
      } else if (state.updatedAt && (!d.updatedAt || state.updatedAt > d.updatedAt)) writeDb();
    } else if (Object.keys(state.answers).length) writeDb();
    setSave('已连接 · 答案自动保存');
  } catch (e) { setSave('暂时连不上存储，答案先存在这台设备上', true); }
  const y = window.scrollY; render(); window.scrollTo(0, y);
})();
</script>
</body>
</html>
