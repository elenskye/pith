      body { font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 10px; }

      #results li:hover { background: #eef5f4; }
      #picked li { display: flex; gap: 4px; align-items: center; }
      #picked li span { flex: 1; }
      h4 { margin: 8px 0 2px; font-size: 12px; color: #444; }
      pre { font-size: 11px; background: #f6f6f6; padding: 6px; overflow: auto; }
      #log { font-size: 11px; padding-left: 16px; }
      #log .err { color: #b00020; }
