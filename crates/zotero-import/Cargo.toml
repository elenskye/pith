[package]
name = "zotero-import"
version = "0.0.1"
description = "只读读取 Zotero 数据库副本，输出无损中间模型与误差报告（Phase 0-A）"
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
md-5 = "0.11"

[[bin]]
name = "zotero-probe"
path = "src/main.rs"
