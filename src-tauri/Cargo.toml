[package]
name = "pith"
version = "0.4.0"
description = "Pith：本地优先的研究工作台"
edition.workspace = true
publish.workspace = true

[lib]
name = "pith_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"
zotero-import = { path = "../crates/zotero-import" }
docx-engine = { path = "../crates/docx-engine" }
research-engine = { path = "../crates/research-engine" }
concept-engine = { path = "../crates/concept-engine" }
sha2 = "0.11"
md-5 = "0.11"
biblatex = "0.12"
regex = "1"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls", "gzip"] }
scraper = { version = "0.27", default-features = false }
encoding_rs = "0.8.44"
calamine = "0.38.0"
pdf-extract = "0.12.1"

# 只有 Mac 用得上的依赖（钥匙串）。Linux 上不编译，云端开发环境才编得过（CLAUDE.md 规则 7）
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
roxmltree = "0.21"
