[package]
name = "pith"
version = "0.2.0"
description = "Pith：本地优先的研究工作台"
edition.workspace = true
publish.workspace = true

[lib]
name = "pith_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
getrandom = "0.3"
tauri-plugin-dialog = "2"
zotero-import = { path = "../crates/zotero-import" }
docx-engine = { path = "../crates/docx-engine" }
sha2 = "0.11"
md-5 = "0.11"
biblatex = "0.12"
regex = "1"
security-framework = "3"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls", "gzip"] }

[dev-dependencies]
roxmltree = "0.21"
