<h1>示例市青年就业形势总体稳定</h1>
<p class="note">示例日报　2025 年 2 月 21 日</p>
<p>示例日报讯　记者从示例市统计局获悉，2024 年全市 16–24 岁城镇青年调查失业率为 12.3%，就业形势总体稳定。</p>
<p>统计局有关负责人表示，将继续做好高校毕业生等重点群体的就业服务。</p>
